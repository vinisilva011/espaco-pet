name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Gerar instalador .exe
        run: npm run dist:win

      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Espaco-Pet-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
